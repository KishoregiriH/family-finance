<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transactions</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="header">
📋 Transaction History
</div>

<div class="section">

<table id="transactionTable">

<thead>
<tr>
<th>Date</th>
<th>Person</th>
<th>Type</th>
<th>Amount</th>
</tr>
</thead>

<tbody>
</tbody>

</table>

</div>

<script>

async function loadTransactions(){

const response = await fetch(
"https://script.google.com/macros/s/AKfycbyr5Uu3r7hjsz2JHsFpvwzTyMAIAlU5gSVBAm2mznw7GYIHjeQllzT-9WCHMT-ZJL0u/exec?action=transactions"
);

const data = await response.json();

let html = "";

data.forEach(item => {

html += `
<tr>
<td>${item.date}</td>
<td>${item.person}</td>
<td>${item.type}</td>
<td>₹${item.amount}</td>
</tr>
`;

});

document.querySelector("#transactionTable tbody").innerHTML = html;

}

loadTransactions();

</script>

</body>
</html>
