<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
.reports-page{ padding:15px; }

.month-selector{
display:flex;
align-items:center;
gap:10px;
background:white;
border-radius:16px;
padding:14px 16px;
box-shadow:0 2px 8px rgba(0,0,0,0.06);
margin-bottom:16px;
}

.month-selector label{
font-size:12px;
font-weight:700;
color:#6b7280;
letter-spacing:0.3px;
white-space:nowrap;
}

.month-selector input{
flex:1;
border:1.5px solid #e5e7eb;
border-radius:10px;
padding:9px 12px;
font-size:14px;
outline:none;
background:white;
color:#111827;
}

.month-selector input:focus{ border-color:#2563eb; }

.month-selector button{
background:linear-gradient(135deg,#2563eb,#4f46e5);
color:white;
border:none;
border-radius:10px;
padding:10px 16px;
font-size:13px;
font-weight:700;
cursor:pointer;
white-space:nowrap;
}

/* STAT CARDS */
.stat-row{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:10px;
margin-bottom:16px;
}

.stat-card{
background:white;
border-radius:16px;
padding:14px 10px;
text-align:center;
box-shadow:0 2px 8px rgba(0,0,0,0.06);
}

.stat-card .stat-label{
font-size:10px;
font-weight:700;
letter-spacing:0.5px;
color:#9ca3af;
margin-bottom:6px;
}

.stat-card .stat-val{
font-size:14px;
font-weight:800;
}

.stat-card.income .stat-val{ color:#16a34a; }
.stat-card.expense .stat-val{ color:#dc2626; }
.stat-card.saving .stat-val{ color:#2563eb; }

/* CHART CARDS */
.chart-card{
background:white;
border-radius:18px;
padding:18px;
box-shadow:0 2px 8px rgba(0,0,0,0.06);
margin-bottom:16px;
}

.chart-card h4{
font-size:14px;
font-weight:700;
color:#374151;
margin-bottom:14px;
display:flex;
align-items:center;
gap:6px;
}

.chart-wrap{
position:relative;
width:100%;
}

.chart-wrap canvas{
width:100% !important;
}

/* PERSON COMPARE */
.person-compare{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:16px;
}

.person-card{
background:white;
border-radius:18px;
padding:16px;
box-shadow:0 2px 8px rgba(0,0,0,0.06);
}

.person-card .pc-name{
font-size:13px;
font-weight:700;
color:#374151;
margin-bottom:12px;
display:flex;
align-items:center;
gap:6px;
}

.pc-avatar{
width:28px;height:28px;
border-radius:50%;
display:flex;align-items:center;justify-content:center;
font-size:12px;font-weight:700;color:white;
}

.pc-av-blue{ background:#2563eb; }
.pc-av-cyan{ background:#0891b2; }

.pc-stat{ margin-bottom:8px; }
.pc-stat-label{ font-size:10px; color:#9ca3af; font-weight:600; margin-bottom:3px; }
.pc-stat-bar-wrap{ background:#f3f4f6; border-radius:4px; height:6px; overflow:hidden; margin-bottom:2px; }
.pc-stat-bar{ height:6px; border-radius:4px; transition:width 0.6s ease; }
.bar-income{ background:#16a34a; }
.bar-expense{ background:#dc2626; }
.bar-saving{ background:#2563eb; }
.pc-stat-val{ font-size:11px; font-weight:700; color:#374151; }

/* NO DATA */
.no-data{
text-align:center;
padding:40px 20px;
color:#9ca3af;
font-size:14px;
}
</style>
</head>
<body>

<!-- TOP HEADER -->
<div class="top-header">
  <div class="header-left">
    <a href="index.html" class="back-btn">←</a>
    <div class="header-title">
      <h1>📊 Reports</h1>
      <p>Financial insights</p>
    </div>
  </div>
</div>

<div class="reports-page">

  <!-- MONTH SELECTOR -->
  <div class="month-selector">
    <label>📅 Month</label>
    <input type="month" id="reportMonth">
    <button onclick="loadReport()">View</button>
  </div>

  <!-- STAT SUMMARY -->
  <div class="stat-row">
    <div class="stat-card income">
      <div class="stat-label">INCOME</div>
      <div class="stat-val" id="rpt-income">—</div>
    </div>
    <div class="stat-card expense">
      <div class="stat-label">EXPENSE</div>
      <div class="stat-val" id="rpt-expense">—</div>
    </div>
    <div class="stat-card saving">
      <div class="stat-label">SAVING</div>
      <div class="stat-val" id="rpt-saving">—</div>
    </div>
  </div>

  <!-- PERSON COMPARISON -->
  <div class="person-compare">
    <div class="person-card">
      <div class="pc-name">
        <div class="pc-avatar pc-av-blue" id="pc-av1">K</div>
        <span id="pc-name1">Kishore</span>
      </div>
      <div id="pc-stats1"></div>
    </div>
    <div class="person-card">
      <div class="pc-name">
        <div class="pc-avatar pc-av-cyan" id="pc-av2">D</div>
        <span id="pc-name2">Darshini</span>
      </div>
      <div id="pc-stats2"></div>
    </div>
  </div>

  <!-- MONTHLY BAR CHART -->
  <div class="chart-card">
    <h4>📈 Monthly Overview (Last 6 Months)</h4>
    <div class="chart-wrap" style="height:220px;">
      <canvas id="barChart"></canvas>
    </div>
  </div>

  <!-- CATEGORY PIE CHART -->
  <div class="chart-card">
    <h4>🍩 Expense by Category</h4>
    <div class="chart-wrap" style="height:240px;">
      <canvas id="pieChart"></canvas>
    </div>
  </div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <a href="index.html"><span class="nav-icon">🏠</span>Home</a>
  <a href="add.html"><span class="nav-icon">➕</span>Add</a>
  <a href="transactions.html"><span class="nav-icon">📋</span>Transactions</a>
  <a href="reports.html" class="active"><span class="nav-icon">📊</span>Reports</a>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbyr5Uu3r7hjsz2JHsFpvwzTyMAIAlU5gSVBAm2mznw7GYIHjeQllzT-9WCHMT-ZJL0u/exec?action=transactions";
const currentUser = localStorage.getItem("currentUser") || "Kishore";
const otherUser   = currentUser === "Kishore" ? "Darshini" : "Kishore";

// Set default month to current
const now = new Date();
document.getElementById("reportMonth").value =
  now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0");

let barChartInst = null;
let pieChartInst = null;
let allData = [];

function fmt(n){ return "₹" + Number(n).toLocaleString("en-IN"); }

function getYM(dateStr){
  const d = new Date(dateStr);
  if(isNaN(d)) return null;
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
}

function calcTotals(rows){
  let income=0,expense=0,saving=0;
  rows.forEach(t=>{
    const a=Number(t.amount)||0;
    const tp=(t.type||"").toLowerCase();
    if(tp==="income") income+=a;
    else if(tp==="expense") expense+=a;
    else if(tp==="saving") saving+=a;
  });
  return{income,expense,saving};
}

async function fetchData(){
  if(allData.length) return allData;
  const res = await fetch(API);
  allData = await res.json();
  return allData;
}

function renderPersonStats(containerId, totals, maxVal){
  const pct = v => maxVal > 0 ? Math.round((v/maxVal)*100) : 0;
  document.getElementById(containerId).innerHTML = `
    <div class="pc-stat">
      <div class="pc-stat-label">INCOME</div>
      <div class="pc-stat-bar-wrap"><div class="pc-stat-bar bar-income" style="width:${pct(totals.income)}%"></div></div>
      <div class="pc-stat-val">${fmt(totals.income)}</div>
    </div>
    <div class="pc-stat">
      <div class="pc-stat-label">EXPENSE</div>
      <div class="pc-stat-bar-wrap"><div class="pc-stat-bar bar-expense" style="width:${pct(totals.expense)}%"></div></div>
      <div class="pc-stat-val">${fmt(totals.expense)}</div>
    </div>
    <div class="pc-stat">
      <div class="pc-stat-label">SAVING</div>
      <div class="pc-stat-bar-wrap"><div class="pc-stat-bar bar-saving" style="width:${pct(totals.saving)}%"></div></div>
      <div class="pc-stat-val">${fmt(totals.saving)}</div>
    </div>`;
}

async function loadReport(){
  const month = document.getElementById("reportMonth").value;
  const data  = await fetchData();

  // Filter for selected month
  const monthRows = data.filter(t => getYM(t.date) === month);
  const totals = calcTotals(monthRows);

  // Stat cards
  document.getElementById("rpt-income").textContent  = fmt(totals.income);
  document.getElementById("rpt-expense").textContent = fmt(totals.expense);
  document.getElementById("rpt-saving").textContent  = fmt(totals.saving);

  // Person avatars/names
  document.getElementById("pc-av1").textContent  = currentUser.charAt(0);
  document.getElementById("pc-av2").textContent  = otherUser.charAt(0);
  document.getElementById("pc-name1").textContent = currentUser;
  document.getElementById("pc-name2").textContent = otherUser;

  // Person comparison
  const t1 = calcTotals(monthRows.filter(t=>t.person===currentUser));
  const t2 = calcTotals(monthRows.filter(t=>t.person===otherUser));
  const maxV = Math.max(t1.income,t1.expense,t1.saving,t2.income,t2.expense,t2.saving,1);
  renderPersonStats("pc-stats1", t1, maxV);
  renderPersonStats("pc-stats2", t2, maxV);

  // ── BAR CHART: last 6 months ──
  const months = [];
  const labels = [];
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const ym = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    months.push(ym);
    labels.push(d.toLocaleString("default",{month:"short"}));
  }

  const barIncome  = months.map(m=>calcTotals(data.filter(t=>getYM(t.date)===m)).income);
  const barExpense = months.map(m=>calcTotals(data.filter(t=>getYM(t.date)===m)).expense);
  const barSaving  = months.map(m=>calcTotals(data.filter(t=>getYM(t.date)===m)).saving);

  if(barChartInst) barChartInst.destroy();
  barChartInst = new Chart(document.getElementById("barChart"),{
    type:"bar",
    data:{
      labels,
      datasets:[
        {label:"Income",  data:barIncome,  backgroundColor:"#16a34a", borderRadius:6, borderSkipped:false},
        {label:"Expense", data:barExpense, backgroundColor:"#dc2626", borderRadius:6, borderSkipped:false},
        {label:"Saving",  data:barSaving,  backgroundColor:"#2563eb", borderRadius:6, borderSkipped:false}
      ]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{ legend:{ position:"bottom", labels:{ font:{size:11}, boxWidth:12 } } },
      scales:{
        x:{ grid:{display:false}, ticks:{font:{size:11}} },
        y:{ grid:{color:"#f3f4f6"}, ticks:{ font:{size:10}, callback:v=>"₹"+v.toLocaleString("en-IN") } }
      }
    }
  });

  // ── PIE CHART: category-wise expense for selected month ──
  const expenseRows = monthRows.filter(t=>(t.type||"").toLowerCase()==="expense");
  const catMap = {};
  expenseRows.forEach(t=>{
    const c = t.category || "Other";
    catMap[c] = (catMap[c]||0) + (Number(t.amount)||0);
  });

  const catLabels = Object.keys(catMap);
  const catVals   = Object.values(catMap);
  const pieColors = ["#2563eb","#dc2626","#16a34a","#f59e0b","#8b5cf6","#0891b2","#f97316","#ec4899","#14b8a6","#6366f1","#84cc16","#ef4444"];

  if(pieChartInst) pieChartInst.destroy();

  if(!catLabels.length){
    document.getElementById("pieChart").parentElement.innerHTML =
      '<div class="no-data">No expense data for this month</div>';
  } else {
    pieChartInst = new Chart(document.getElementById("pieChart"),{
      type:"doughnut",
      data:{
        labels:catLabels,
        datasets:[{ data:catVals, backgroundColor:pieColors.slice(0,catLabels.length), borderWidth:2, borderColor:"white" }]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        plugins:{
          legend:{ position:"bottom", labels:{ font:{size:11}, boxWidth:12 } },
          tooltip:{
            callbacks:{
              label: ctx => " " + ctx.label + ": ₹" + ctx.parsed.toLocaleString("en-IN")
            }
          }
        }
      }
    });
  }
}

// Auto-load on page open
loadReport();
</script>

</body>
</html>
