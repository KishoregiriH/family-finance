<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Transaction</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-header">
  <div class="header-left">
    <a href="transactions.html" class="back-btn">←</a>
    <div class="header-title">
      <h1>✏️ Edit Transaction</h1>
      <p>Update your record</p>
    </div>
  </div>
</div>

<div class="add-page">

  <!-- OWNER BADGE -->
  <div class="edit-owner-badge">
    <span id="ownerChip" class="owner-chip"></span>
    <span id="ownerLabel" class="owner-label"></span>
    <span class="owner-lock">🔒 Person cannot be changed</span>
  </div>

  <!-- TYPE TOGGLE -->
  <div class="type-toggle">
    <button id="btn-income"  onclick="setType('Income')"><span class="toggle-emoji">📈</span>Income</button>
    <button id="btn-expense" onclick="setType('Expense')"><span class="toggle-emoji">📉</span>Expense</button>
    <button id="btn-saving"  onclick="setType('Saving')"><span class="toggle-emoji">🏦</span>Saving</button>
  </div>

  <!-- AMOUNT -->
  <div class="amount-card">
    <label>ENTER AMOUNT</label>
    <div class="amount-row">
      <span class="currency">₹</span>
      <input type="number" id="amount" placeholder="0" inputmode="numeric">
    </div>
  </div>

  <!-- CATEGORY GRID -->
  <div class="section-title">📂 Category</div>
  <div class="cat-grid" id="catGrid">
    <div class="cat-item" onclick="selectCat(this,'Salary')"><div class="cat-emoji">💰</div><div class="cat-name">Salary</div></div>
    <div class="cat-item" onclick="selectCat(this,'Fuel')"><div class="cat-emoji">⛽</div><div class="cat-name">Fuel</div></div>
    <div class="cat-item" onclick="selectCat(this,'Grocery')"><div class="cat-emoji">🛒</div><div class="cat-name">Grocery</div></div>
    <div class="cat-item" onclick="selectCat(this,'Shopping')"><div class="cat-emoji">🛍️</div><div class="cat-name">Shopping</div></div>
    <div class="cat-item" onclick="selectCat(this,'Dining')"><div class="cat-emoji">🍽️</div><div class="cat-name">Dining</div></div>
    <div class="cat-item" onclick="selectCat(this,'Medical')"><div class="cat-emoji">🏥</div><div class="cat-name">Medical</div></div>
    <div class="cat-item" onclick="selectCat(this,'Transport')"><div class="cat-emoji">🚌</div><div class="cat-name">Transport</div></div>
    <div class="cat-item" onclick="selectCat(this,'Rent')"><div class="cat-emoji">🏠</div><div class="cat-name">Rent</div></div>
    <div class="cat-item" onclick="selectCat(this,'Loan')"><div class="cat-emoji">🏦</div><div class="cat-name">Loan</div></div>
    <div class="cat-item" onclick="selectCat(this,'Sharing')"><div class="cat-emoji">🤝</div><div class="cat-name">Sharing</div></div>
    <div class="cat-item" onclick="selectCat(this,'Saving')"><div class="cat-emoji">💎</div><div class="cat-name">Saving</div></div>
    <div class="cat-item" onclick="selectCat(this,'Other')"><div class="cat-emoji">📌</div><div class="cat-name">Other</div></div>
  </div>

  <!-- DETAILS FORM -->
  <div class="add-form-card">
    <div class="field">
      <label>PAYMENT METHOD</label>
      <div class="payment-toggle">
        <button id="pay-cash" class="pay-btn" onclick="setPayment('Cash')"><span>💵</span> Cash</button>
        <button id="pay-upi"  class="pay-btn" onclick="setPayment('UPI')"><span>📱</span> UPI</button>
        <button id="pay-card" class="pay-btn" onclick="setPayment('Card')"><span>💳</span> Card</button>
      </div>
    </div>
    <div class="field">
      <label>DATE</label>
      <input type="date" id="date">
    </div>
    <div class="field">
      <label>DESCRIPTION (optional)</label>
      <input type="text" id="description" placeholder="Add a note...">
    </div>
  </div>

  <button class="save-btn" onclick="updateTransaction()">💾 Update Transaction</button>

</div>

<div class="bottom-nav">
  <a href="index.html"><span class="nav-icon">🏠</span>Home</a>
  <a href="add.html"><span class="nav-icon">➕</span>Add</a>
  <a href="transactions.html" class="active"><span class="nav-icon">📋</span>Transactions</a>
  <a href="reports.html"><span class="nav-icon">📊</span>Reports</a>
</div>

<script>
if(localStorage.getItem("financeLogin") !== "true") window.location.href = "login.html";

// AUTO LOGOUT
const AUTO_LOGOUT_MS = 60000;
let autoLogoutTimer = null;
function resetAutoLogout(){
  clearTimeout(autoLogoutTimer);
  autoLogoutTimer = setTimeout(()=>{ localStorage.clear(); window.location.href="login.html"; }, AUTO_LOGOUT_MS);
}
["click","touchstart","keydown","scroll","mousemove"].forEach(e => document.addEventListener(e, resetAutoLogout, true));
resetAutoLogout();

let selectedType     = "Income";
let selectedCategory = "Salary";
let selectedPayment  = "Cash";
let editData         = null;

// ── LOAD EDIT DATA ──
window.onload = function(){
  const raw = localStorage.getItem("editTransaction");
  if(!raw){ window.location.href = "transactions.html"; return; }
  editData = JSON.parse(raw);

  // Owner badge — locked, cannot change
  const person = editData.person || "—";
  const chip   = document.getElementById("ownerChip");
  chip.textContent   = person.charAt(0);
  chip.style.background = person === "Kishore" ? "#2563eb" : "#0891b2";
  document.getElementById("ownerLabel").textContent = person;

  // Amount
  document.getElementById("amount").value = editData.amount || "";

  // Date — convert Google Sheet date format if needed
  let dateVal = editData.date || "";
  const d = new Date(dateVal);
  if(!isNaN(d)){
    dateVal = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  document.getElementById("date").value = dateVal;

  // Description
  document.getElementById("description").value = editData.description || "";

  // Type
  const t = (editData.type||"Income");
  selectedType = t;
  setType(t);

  // Category
  const cat = editData.category || "Other";
  selectedCategory = cat;
  document.querySelectorAll(".cat-item").forEach(el => {
    if(el.querySelector(".cat-name").textContent === cat) el.classList.add("selected");
  });

  // Payment
  const pay = editData.payment || "Cash";
  selectedPayment = pay;
  setPayment(pay);
};

function setType(type){
  selectedType = type;
  document.getElementById("btn-income").className  = type==="Income"  ? "active-income"  : "";
  document.getElementById("btn-expense").className = type==="Expense" ? "active-expense" : "";
  document.getElementById("btn-saving").className  = type==="Saving"  ? "active-saving"  : "";
}

function selectCat(el, name){
  document.querySelectorAll(".cat-item").forEach(c => c.classList.remove("selected"));
  el.classList.add("selected");
  selectedCategory = name;
}

function setPayment(method){
  selectedPayment = method;
  document.getElementById("pay-cash").className = method==="Cash" ? "pay-btn active-pay" : "pay-btn";
  document.getElementById("pay-upi").className  = method==="UPI"  ? "pay-btn active-pay" : "pay-btn";
  document.getElementById("pay-card").className = method==="Card" ? "pay-btn active-pay" : "pay-btn";
}

async function updateTransaction(){
  const amount = document.getElementById("amount").value;
  if(!amount || amount <= 0){ alert("Please enter a valid amount"); return; }

  const updated = {
    action      : "update",
    person      : editData.person,
    type        : selectedType,
    category    : selectedCategory,
    amount      : amount,
    date        : document.getElementById("date").value,
    description : document.getElementById("description").value,
    payment     : selectedPayment,
    // Send original values so Google Script can find the row
    originalDate   : editData.date,
    originalAmount : editData.amount,
    originalPerson : editData.person
  };

  const saveBtn = document.querySelector(".save-btn");
  saveBtn.textContent = "Updating...";
  saveBtn.disabled    = true;

  try{
    const res = await fetch(
      "https://script.google.com/macros/s/AKfycbyr5Uu3r7hjsz2JHsFpvwzTyMAIAlU5gSVBAm2mznw7GYIHjeQllzT-9WCHMT-ZJL0u/exec",
      { method:"POST", body: JSON.stringify(updated) }
    );
    const result = await res.json();
    if(result.status === "success"){
      alert("✅ Transaction Updated!");
      localStorage.removeItem("editTransaction");
      window.location.href = "transactions.html";
    } else {
      alert("❌ Update failed: " + (result.message || "Try again."));
    }
  } catch(err){
    console.error(err);
    alert("❌ Error updating. Check connection.");
  } finally {
    saveBtn.textContent = "💾 Update Transaction";
    saveBtn.disabled    = false;
  }
}
</script>

</body>
</html>
