<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transactions</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- TOP HEADER -->
<div class="top-header">
  <div class="header-left">
    <a href="index.html" class="back-btn">←</a>
    <div class="header-title">
      <h1>📋 Transactions</h1>
      <p>All your records</p>
    </div>
  </div>
</div>

<div class="page-content">

  <!-- FILTER BUTTONS -->
  <div class="filter-bar">
    <button class="filter-btn active" id="btnAll"      onclick="setUserFilter('all')">👥 All</button>
    <button class="filter-btn"        id="btnKishore"  onclick="setUserFilter('Kishore')">👤 Kishore</button>
    <button class="filter-btn"        id="btnDarshini" onclick="setUserFilter('Darshini')">👤 Darshini</button>
    <button class="filter-btn"        id="btnDate"     onclick="toggleDateFilter()">📅 Filter</button>
  </div>

  <!-- DATE FILTER PANEL -->
  <div class="filter-section" id="dateFilterPanel">
    <div class="filter-row">
      <div>
        <label>From Date</label>
        <input type="date" id="fromDate">
      </div>
      <div>
        <label>To Date</label>
        <input type="date" id="toDate">
      </div>
    </div>
    <div class="filter-row" style="margin-bottom:10px;">
      <div>
        <label>Month</label>
        <input type="month" id="monthFilter">
      </div>
    </div>
    <button class="apply-btn" onclick="applyFilters()">Apply Filter</button>
    <button class="clear-btn"  onclick="clearFilters()">Clear Filter</button>
  </div>

  <!-- TAP HINT -->
  <div style="font-size:11px;color:#9ca3af;margin-bottom:8px;padding-left:4px;">
    💡 Tap a row to see details
  </div>

  <!-- TABLE -->
  <div class="txn-table-wrap">
    <table id="transactionTable">
      <thead>
        <tr>
          <th>Date</th>
          <th>Category</th>
          <th>Type</th>
          <th>Amount</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <a href="index.html"><span class="nav-icon">🏠</span>Home</a>
  <a href="add.html"><span class="nav-icon">➕</span>Add</a>
  <a href="transactions.html" class="active"><span class="nav-icon">📋</span>Transactions</a>
  <a href="reports.html"><span class="nav-icon">📊</span>Reports</a>
</div>

<script>
// ── LOGIN CHECK ──
if(localStorage.getItem("financeLogin") !== "true"){
  window.location.href = "login.html";
}

// ── AUTO LOGOUT ──
const AUTO_LOGOUT_MS = 60 * 1000;
let autoLogoutTimer = null;
function resetAutoLogout(){
  clearTimeout(autoLogoutTimer);
  autoLogoutTimer = setTimeout(function(){
    const banner = document.createElement("div");
    banner.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99999;background:#dc2626;color:white;text-align:center;padding:14px;font-size:14px;font-weight:700;";
    banner.textContent = "⏻ Auto-logout: Session expired due to inactivity.";
    document.body.appendChild(banner);
    setTimeout(function(){
      localStorage.removeItem("financeLogin");
      localStorage.removeItem("currentUser");
      localStorage.removeItem("skipLoading");
      window.location.href = "login.html";
    }, 1500);
  }, AUTO_LOGOUT_MS);
}
["click","touchstart","keydown","scroll","mousemove"].forEach(function(evt){
  document.addEventListener(evt, resetAutoLogout, true);
});
resetAutoLogout();

let allData  = [];
let activeUser = "all";

function formatDate(raw){
  if(!raw) return "—";
  const d = new Date(raw);
  if(isNaN(d)) return raw;
  return String(d.getDate()).padStart(2,"0") + "-" +
         String(d.getMonth()+1).padStart(2,"0") + "-" +
         d.getFullYear();
}

function typeBadge(type){
  const t   = (type||"").toLowerCase();
  const cls = t==="income" ? "income" : t==="saving" ? "saving" : "expense";
  return `<span class="type-badge ${cls}">${type||"—"}</span>`;
}

// Support both "payment" and "Payment Method" column names from Google Sheet
function getPayment(item){
  return item["Payment Method"] || item["payment"] || item["Payment"] || "";
}

async function loadTransactions(){
  try{
    const res = await fetch(
      "https://script.google.com/macros/s/AKfycbyr5Uu3r7hjsz2JHsFpvwzTyMAIAlU5gSVBAm2mznw7GYIHjeQllzT-9WCHMT-ZJL0u/exec?action=transactions"
    );
    allData = await res.json();
    renderTable(allData);
  } catch(e){
    document.querySelector("#transactionTable tbody").innerHTML =
      '<tr><td colspan="4" style="text-align:center;color:#9ca3af;padding:20px;">Could not load transactions</td></tr>';
  }
}

function renderTable(data){
  let html = "";
  if(!data.length){
    html = '<tr><td colspan="4" style="text-align:center;color:#9ca3af;padding:20px;">No transactions found</td></tr>';
  }

  data.forEach((item, idx) => {
    const pay     = getPayment(item);
    const desc    = (item.description || item.Description || "").trim();
    const hasExtra = pay || desc;

    const chevron = hasExtra
      ? `<span class="row-chevron" id="chev-${idx}">▼</span>`
      : "";

    // Person initial chip colour
    const chipColor = (item.person||"") === "Kishore" ? "#2563eb" : "#0891b2";

    html += `
      <tr class="txn-main-row${hasExtra ? " expandable" : ""}"
          onclick="${hasExtra ? "toggleDetail(" + idx + ")" : ""}">
        <td>
          <span class="txn-person-chip" style="background:${chipColor}">
            ${(item.person||"?").charAt(0)}
          </span>
          ${formatDate(item.date)}
        </td>
        <td>${item.category || item.type || "—"}</td>
        <td>${typeBadge(item.type)}</td>
        <td style="font-weight:700;white-space:nowrap;">
          ₹${Number(item.amount||0).toLocaleString("en-IN")}
          ${chevron}
        </td>
      </tr>`;

    if(hasExtra){
      html += `
      <tr class="txn-detail-row" id="detail-${idx}" style="display:none;">
        <td colspan="4">
          <div class="txn-detail-box">
            ${pay  ? `<div class="detail-chip">💳 <strong>Payment:</strong>&nbsp;${pay}</div>`  : ""}
            ${desc ? `<div class="detail-chip">📝 <strong>Note:</strong>&nbsp;${desc}</div>` : ""}
          </div>
        </td>
      </tr>`;
    }
  });

  document.querySelector("#transactionTable tbody").innerHTML = html;
}

function toggleDetail(idx){
  const row  = document.getElementById("detail-" + idx);
  const chev = document.getElementById("chev-"   + idx);
  if(!row) return;
  const open = row.style.display !== "none";
  row.style.display = open ? "none" : "table-row";
  if(chev) chev.textContent = open ? "▼" : "▲";
}

function setUserFilter(user){
  activeUser = user;
  ["all","Kishore","Darshini"].forEach(u => {
    const btn = document.getElementById("btn" + (u==="all" ? "All" : u));
    if(btn) btn.classList.toggle("active", u === user);
  });
  applyFilters();
}

function toggleDateFilter(){
  const panel = document.getElementById("dateFilterPanel");
  panel.classList.toggle("open");
  document.getElementById("btnDate").classList.toggle("active", panel.classList.contains("open"));
}

function applyFilters(){
  let filtered = [...allData];
  if(activeUser !== "all") filtered = filtered.filter(i => i.person === activeUser);

  const from  = document.getElementById("fromDate").value;
  const to    = document.getElementById("toDate").value;
  const month = document.getElementById("monthFilter").value;

  if(month){
    filtered = filtered.filter(i => {
      const d = new Date(i.date);
      return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") === month;
    });
  } else {
    if(from) filtered = filtered.filter(i => new Date(i.date) >= new Date(from));
    if(to)   filtered = filtered.filter(i => new Date(i.date) <= new Date(to));
  }
  renderTable(filtered);
}

function clearFilters(){
  activeUser = "all";
  document.getElementById("fromDate").value    = "";
  document.getElementById("toDate").value      = "";
  document.getElementById("monthFilter").value = "";
  document.getElementById("btnAll").classList.add("active");
  document.getElementById("btnKishore").classList.remove("active");
  document.getElementById("btnDarshini").classList.remove("active");
  renderTable(allData);
}

loadTransactions();
</script>

</body>
</html>
