<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kishore & Darshini Financial Dashboard</title>
<link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-container">
  <div class="login-card">

    <div class="logo">
      <div class="logo-icon">💰</div>
      <h1 class="logo-title">Kishore & Darshini</h1>
      <p class="logo-subtitle">Family Finance</p>
      <div class="logo-divider"></div>
      <p class="logo-tagline">Track together. Grow together.</p>
    </div>

    <div class="form-group">
      <label>Select User</label>
      <select id="user">
        <option value="Kishore">Kishore</option>
        <option value="Darshini">Darshini</option>
      </select>
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="password-box">
        <input type="password" id="password" placeholder="Enter Password">
        <span onclick="togglePassword()">👁️</span>
      </div>
    </div>

    <button class="login-btn" onclick="login()">Login</button>

    <div class="footer-text">❤️ Let's manage our finances wisely today</div>

  </div>
</div>

<!-- MERGED WELCOME + LOADING OVERLAY -->
<div id="welcomeOverlay" class="welcome-overlay">
  <div class="welcome-emoji">❤️</div>
  <div class="welcome-name" id="welcomeName">Welcome Back!</div>
  <div class="welcome-sub">Let's manage your finances wisely</div>
  <div class="loader"></div>
  <div class="loading-label">LOADING DASHBOARD...</div>
</div>

<script>
function togglePassword(){
  let pwd = document.getElementById("password");
  pwd.type = pwd.type === "password" ? "text" : "password";
}

function login(){
  let user = document.getElementById("user").value;
  let password = document.getElementById("password").value;

  if(user === "Kishore" && password === "1998"){
    localStorage.setItem("currentUser","Kishore");
    localStorage.setItem("financeLogin","true");
    localStorage.setItem("skipLoading","true");
    showWelcome("Kishore");
  }
  else if(user === "Darshini" && password === "2000"){
    localStorage.setItem("currentUser","Darshini");
    localStorage.setItem("financeLogin","true");
    localStorage.setItem("skipLoading","true");
    showWelcome("Darshini");
  }
  else{
    alert("Invalid Password");
  }
}

function showWelcome(user){
  document.getElementById("welcomeName").textContent = "Welcome Back, " + user + "! 👋";
  document.getElementById("welcomeOverlay").style.display = "flex";
  setTimeout(function(){
    window.location.href = "index.html";
  }, 2500);
}
</script>

</body>
</html>
