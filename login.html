<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Financial Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>💰</h1>

        <h2>Kishore & Darshini</h2>

        <p>Financial Dashboard</p>

        <label>Select User</label>

        <select id="user">
            <option value="Kishore">Kishore</option>
            <option value="Darshini">Darshini</option>
        </select>

        <label>Password</label>

        <div class="password-box">

            <input
                type="password"
                id="password"
                placeholder="Enter Password">

            <span onclick="togglePassword()">
                👁️
            </span>

        </div>

        <button onclick="login()">
            Login
        </button>

    </div>

</div>

<script>

function togglePassword(){

    const pwd =
    document.getElementById("password");

    if(pwd.type==="password"){
        pwd.type="text";
    }
    else{
        pwd.type="password";
    }
}

function login(){

    let user =
    document.getElementById("user").value;

    let password =
    document.getElementById("password").value;

    if(
        user==="Kishore" &&
        password==="1998"
    ){

        localStorage.setItem(
            "currentUser",
            "Kishore"
        );

        localStorage.setItem(
            "financeLogin",
            "true"
        );

        window.location.href =
        "index.html";

    }

    else if(
        user==="Darshini" &&
        password==="2000"
    ){

        localStorage.setItem(
            "currentUser",
            "Darshini"
        );

        localStorage.setItem(
            "financeLogin",
            "true"
        );

        window.location.href =
        "index.html";

    }

    else{

        alert(
            "Invalid Password"
        );

    }

}

</script>

</body>
</html>
